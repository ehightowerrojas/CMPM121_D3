<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3 project</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
          <dt>Reeds</dt>
          <dd id="reeds"></dd>
          <dt>Driftwood</dt>
          <dd id="driftwood"></dd>
          <dt>Stone</dt>
          <dd id="stone"></dd>
          <dt>Hardwood</dt>
          <dd id="hardwood"></dd>
        </dl>
        <p id="goal">Goal: build a Sturdy Raft to escape the islands.</p>
        <section id="ending" hidden aria-labelledby="ending-heading">
          <h2 id="ending-heading">You escaped!</h2>
          <p>Your sturdy raft carries you beyond the islands.</p>
        </section>
        <section aria-labelledby="recipes-heading">
          <h2 id="recipes-heading">Recipes</h2>
          <ul id="recipes"></ul>
        </section>
        <p id="live" aria-live="polite"></p>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
      </aside>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
